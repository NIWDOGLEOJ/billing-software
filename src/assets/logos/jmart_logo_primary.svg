<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%">
  <defs>
    <linearGradient id="jmartBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="jmartOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15" flood-color="#0284C7" />
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(15, 10)" filter="url(#subtleShadow)">
    <!-- Cart Basket Base -->
    <path d="M 18 70 L 78 70 L 68 36 L 28 36 Z" fill="none" stroke="url(#jmartOrange)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Stylized 'J' Stem & Swoop -->
    <path d="M 58 14 L 58 64 C 58 78 44 82 30 76" fill="none" stroke="url(#jmartBlue)" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Awning Canopy -->
    <path d="M 24 22 Q 34 12 44 22 Q 54 12 64 22" fill="none" stroke="url(#jmartOrange)" stroke-width="5" stroke-linecap="round"/>

    <!-- Trolley Wheels -->
    <circle cx="32" cy="85" r="7" fill="url(#jmartBlue)"/>
    <circle cx="66" cy="85" r="7" fill="url(#jmartBlue)"/>
    <circle cx="32" cy="85" r="3" fill="#FFFFFF"/>
    <circle cx="66" cy="85" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <g transform="translate(118, 73)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="52" fill="#0F172A" letter-spacing="-1">
      <tspan fill="#2563EB">J</tspan> MART
    </text>
    <text x="4" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="700" font-size="12.5" fill="#64748B" letter-spacing="4">
      SUPERMARKET &amp; RETAIL
    </text>
  </g>
</svg>
